openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead operations
  - name: businesses
    description: Signed-in owner business profile operations
  - name: notifications
    description: Native lead notification operations
  - name: admin
    description: Read-only founder administration operations
paths:
  /user/welcome:
    post:
      operationId: claimWelcome
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Claim the verified new user's one-time welcome screen
      responses:
        "200":
          description: Welcome eligibility and next destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeEntry"
        "401":
          description: Authentication required
        "403":
          description: Verified email required
        "502":
          description: Welcome could not be checked
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /businesses/me:
    get:
      operationId: getBusinessProfile
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Get the signed-in owner's business profile
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
        "401":
          description: Authentication required
        "404":
          description: No business is configured for this account
        "502":
          description: Business profile could not be loaded
    patch:
      operationId: updateBusinessProfile
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Update the signed-in owner's business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessProfileUpdate"
      responses:
        "200":
          description: Updated business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
        "400":
          description: Invalid or empty business profile update
        "401":
          description: Authentication required
        "404":
          description: No business is configured for this account
        "502":
          description: Business profile could not be updated
  /admin/call-quality:
    get:
      operationId: getAdminCallQuality
      tags: [admin]
      security:
        - clerkSession: []
      summary: Read-only scorecard for the latest 100 recorded inbound calls
      responses:
        "200":
          description: Call quality scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCallQuality"
        "404":
          description: Not found or not authorized
        "502":
          description: Unable to load scorecard
  /businesses/me/demo-call:
    post:
      operationId: createOwnerDemoCall
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Place one development-only test call to the owner's confirmed saved number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerDemoConfirmation"
      responses:
        "200":
          description: Test call requested
          content:
            application/json:
              schema:
                type: object
                required: [callId, message]
                properties:
                  callId:
                    type: string
                  message:
                    type: string
        "400":
          description: Missing existing number or unconfirmed owner number
        "401":
          description: Authentication required
        "404":
          description: Not available
        "429":
          description: Three attempts per business day have been used
        "502":
          description: Provider rejected the call or its outcome is uncertain
  /notifications/inbox:
    get:
      operationId: getLeadAlertInbox
      tags: [notifications]
      security:
        - clerkSession: []
      summary: Owner-scoped unread real-lead alerts
      responses:
        "200":
          description: Lead alert inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadAlertInbox"
        "401":
          description: Authentication required
    post:
      operationId: readLeadAlerts
      tags: [notifications]
      security:
        - clerkSession: []
      summary: Mark only the owner's alerts through an observed event ID as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertReadReceipt"
      responses:
        "204":
          description: Alerts marked read
        "401":
          description: Authentication required
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      security:
        - clerkSession: []
      summary: List Google Sheet leads
      description: Returns normalized lead rows for the signed-in business owner.
      responses:
        "200":
          description: Business lead workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadWorkspace"
        "401":
          description: Authentication required
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be read
  /leads/{leadId}/status:
    patch:
      operationId: updateLeadStatus
      tags: [leads]
      security:
        - clerkSession: []
      summary: Update a lead status
      description: Updates one lead in the signed-in business owner's Google Sheet.
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadStatusUpdate"
      responses:
        "200":
          description: Confirmed lead status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStatusResult"
        "400":
          description: Invalid lead ID or status
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Lead not found in the business sheet
        "409":
          description: The stable lead ID is duplicated
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be updated
  /notifications/status:
    get:
      operationId: getNotificationStatus
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Get notification readiness
      responses:
        "200":
          description: Notification status for the signed-in owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
  /notification-devices:
    post:
      operationId: registerNotificationDevice
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Register or refresh a native push device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDeviceRegistration"
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDevice"
        "400":
          description: Invalid registration
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
  /notification-devices/{deviceId}:
    delete:
      operationId: revokeNotificationDevice
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Revoke one native push device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      responses:
        "204":
          description: Device revoked
        "400":
          description: Invalid device ID
        "401":
          description: Authentication required
        "404":
          description: Device not found
  /notifications/poll/run:
    post:
      operationId: runNotificationPoll
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Run one poll for the signed-in business
      description: Development verification endpoint. It is unavailable in production.
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPollResult"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Endpoint unavailable in production
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be read
  /notifications/outbox:
    get:
      operationId: listNotificationOutbox
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Inspect queued notifications for the signed-in business
      description: Development verification endpoint. It is unavailable in production.
      responses:
        "200":
          description: Recent notification events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationOutboxEvent"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Endpoint unavailable in production
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      security:
        - clerkSession: []
      summary: Get the read-only founder overview
      description: Requires a verified Clerk email listed in ADMIN_EMAILS. Unauthorized requests receive a not-found response.
      responses:
        "200":
          description: Business overview and global metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "404":
          description: Not found or administrator access is unavailable
  /admin/businesses/{businessId}:
    get:
      operationId: getAdminBusiness
      tags: [admin]
      security:
        - clerkSession: []
      summary: Get a business, its leads, and its Retell call history
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusinessDetail"
        "400":
          description: Invalid business ID
        "404":
          description: Not found, business missing, or administrator access unavailable
  /admin/activity:
    get:
      operationId: getAdminActivity
      tags: [admin]
      security:
        - clerkSession: []
      summary: Get the global lead activity feed
      responses:
        "200":
          description: Newest leads and global lead counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivity"
        "404":
          description: Not found or administrator access is unavailable
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminCallQuality:
      type: object
      required: [totalCalls, completeCalls, completePercent, calls]
      properties:
        totalCalls:
          type: number
        completeCalls:
          type: number
        completePercent:
          type: [number, "null"]
        calls:
          type: array
          items:
            $ref: "#/components/schemas/CallQualityRow"
    CallQualityRow:
      type: object
      required: [id, businessName, startedAt, durationMs, nameCaptured, callbackCaptured, issueCaptured, addressCaptured, ending, leadCreated, needsReview, reviewReasons, analysisComplete]
      properties:
        id:
          type: string
        businessName:
          type: string
        startedAt:
          type: string
        durationMs:
          type: [number, "null"]
        nameCaptured:
          type: [boolean, "null"]
        callbackCaptured:
          type: [boolean, "null"]
        issueCaptured:
          type: [boolean, "null"]
        addressCaptured:
          type: [boolean, "null"]
        ending:
          type: string
        leadCreated:
          type: boolean
        needsReview:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
        analysisComplete:
          type: boolean
    Lead:
      type: object
      properties:
        tradeIntakeAnswers:
          type: [string, "null"]
        callerId:
          type: [string, "null"]
        callbackNumber:
          type: [string, "null"]
        availability:
          type: [string, "null"]
        transcript:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        issue:
          type: string
        address:
          type: string
        urgency:
          type: string
          enum: [urgent, normal, low]
        status:
          type: string
          enum: [pending, contacted]
        createdAt:
          type: string
          format: date-time
        contactedAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - name
        - phone
        - issue
        - address
        - urgency
        - status
        - createdAt
        - contactedAt
    WelcomeEntry:
      type: object
      properties:
        showWelcome:
          type: boolean
        nextPath:
          type: string
          enum: ["/onboarding", "/dashboard"]
      required: [showWelcome, nextPath]
    LeadStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, contacted]
      required:
        - status
    LeadStatusResult:
      type: object
      properties:
        leadId:
          type: string
        status:
          type: string
          enum: [pending, contacted]
        contactedAt:
          type: [string, "null"]
          format: date-time
      required:
        - leadId
        - status
        - contactedAt
    LeadWorkspace:
      type: object
      properties:
        isSample:
          type: boolean
        provisioningState:
          type: string
        configured:
          type: boolean
        businessName:
          type: [string, "null"]
        retellPhoneNumber:
          type: [string, "null"]
        timeZone:
          type: [string, "null"]
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required:
        - configured
        - businessName
        - retellPhoneNumber
        - timeZone
        - leads
    BusinessProfile:
      type: object
      additionalProperties: false
      properties:
        ownerPhone:
          type: [string, "null"]
        leadAlertsEnabled:
          type: boolean
        businessHours:
          type: [string, "null"]
        timeZone:
          type: [string, "null"]
        businessName:
          type: string
        agentName:
          type: [string, "null"]
        businessType:
          type: [string, "null"]
        businessWebsiteUrl:
          type: [string, "null"]
        ownerEmail:
          type: [string, "null"]
        serviceArea:
          type: [string, "null"]
        personalityToneDescription:
          type: [string, "null"]
        servicesNotOffered:
          type: [string, "null"]
        majorIssueExamples:
          type: [string, "null"]
        pricingPolicy:
          type: [string, "null"]
        financingPolicy:
          type: [string, "null"]
        brandsWorkedWith:
          type: [string, "null"]
        responseTimeCommitment:
          type: [string, "null"]
        warrantyInfo:
          type: [string, "null"]
        maintenancePlanOfferings:
          type: [string, "null"]
        credentials:
          type: [string, "null"]
        ownerAvailability:
          type: [string, "null"]
        emergencyContactInfo:
          type: [string, "null"]
        retellPhoneNumber:
          type: [string, "null"]
      required:
        - businessName
        - agentName
        - businessType
        - businessWebsiteUrl
        - ownerEmail
        - serviceArea
        - personalityToneDescription
        - servicesNotOffered
        - majorIssueExamples
        - pricingPolicy
        - financingPolicy
        - brandsWorkedWith
        - responseTimeCommitment
        - warrantyInfo
        - maintenancePlanOfferings
        - credentials
        - ownerAvailability
        - emergencyContactInfo
        - retellPhoneNumber
    BusinessProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        ownerPhone:
          type: [string, "null"]
          maxLength: 16
        leadAlertsEnabled:
          type: boolean
        businessHours:
          type: string
          minLength: 1
          maxLength: 500
        timeZone:
          type: string
          minLength: 1
          maxLength: 100
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        agentName:
          type: [string, "null"]
          maxLength: 40
        businessType:
          type: [string, "null"]
          maxLength: 200
        businessWebsiteUrl:
          type: [string, "null"]
          maxLength: 2048
        ownerEmail:
          type: string
          maxLength: 320
        serviceArea:
          type: [string, "null"]
          maxLength: 1000
        personalityToneDescription:
          type: [string, "null"]
          maxLength: 4000
        servicesNotOffered:
          type: [string, "null"]
          maxLength: 4000
        majorIssueExamples:
          type: [string, "null"]
          maxLength: 4000
        pricingPolicy:
          type: [string, "null"]
          maxLength: 4000
        financingPolicy:
          type: [string, "null"]
          maxLength: 4000
        brandsWorkedWith:
          type: [string, "null"]
          maxLength: 4000
        responseTimeCommitment:
          type: [string, "null"]
          maxLength: 4000
        warrantyInfo:
          type: [string, "null"]
          maxLength: 4000
        maintenancePlanOfferings:
          type: [string, "null"]
          maxLength: 4000
        credentials:
          type: [string, "null"]
          maxLength: 4000
        ownerAvailability:
          type: [string, "null"]
          maxLength: 4000
        emergencyContactInfo:
          type: [string, "null"]
          maxLength: 4000
    NotificationPlatform:
      type: string
      enum: [ios, android]
    NotificationDeviceRegistration:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
        platform:
          $ref: "#/components/schemas/NotificationPlatform"
        enabled:
          type: boolean
          default: true
      required:
        - token
        - platform
    OwnerDemoConfirmation:
      type: object
      additionalProperties: false
      required: [confirmedNumber, confirmed]
      properties:
        scenario:
          type: string
          enum: [current, after_hours]
        confirmedNumber:
          type: string
        confirmed:
          type: boolean
    AlertReadReceipt:
      type: object
      additionalProperties: false
      required: [throughId]
      properties:
        throughId:
          type: number
          multipleOf: 1
          minimum: 1
    LeadAlertInbox:
      type: object
      required: [enabled, unreadCount, alerts]
      properties:
        enabled:
          type: boolean
        unreadCount:
          type: number
          multipleOf: 1
        alerts:
          type: array
          items:
            type: object
            required: [id, title, body, deepLink, createdAt]
            properties:
              id:
                type: number
                multipleOf: 1
              title:
                type: string
              body:
                type: string
              deepLink:
                type: string
              createdAt:
                type: string
    NotificationDevice:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        platform:
          $ref: "#/components/schemas/NotificationPlatform"
        enabled:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - platform
        - enabled
        - lastSeenAt
    NotificationStatus:
      type: object
      properties:
        enabledDeviceCount:
          type: number
          multipleOf: 1
        devices:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDevice"
        poller:
          type: object
          properties:
            initialized:
              type: boolean
            lastSucceededAt:
              type: [string, "null"]
              format: date-time
            lastError:
              type: [string, "null"]
          required:
            - initialized
            - lastSucceededAt
            - lastError
      required:
        - enabledDeviceCount
        - devices
        - poller
    NotificationPollResult:
      type: object
      properties:
        businessId:
          type: string
        baselineCreated:
          type: boolean
        rowsRead:
          type: number
          multipleOf: 1
        newEvents:
          type: number
          multipleOf: 1
        duplicateRows:
          type: number
          multipleOf: 1
        polledAt:
          type: string
          format: date-time
      required:
        - businessId
        - baselineCreated
        - rowsRead
        - newEvents
        - duplicateRows
        - polledAt
    NotificationOutboxEvent:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        leadId:
          type: string
        status:
          type: string
          enum: [queued, delivered, failed]
        attempts:
          type: number
          multipleOf: 1
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        lastError:
          type: [string, "null"]
      required:
        - id
        - leadId
        - status
        - attempts
        - createdAt
        - deliveredAt
        - lastError
    AdminOverview:
      type: object
      properties:
        metrics:
          $ref: "#/components/schemas/AdminMetrics"
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/AdminBusinessSummary"
      required: [metrics, businesses]
    AdminMetrics:
      type: object
      properties:
        businessCount:
          type: number
          multipleOf: 1
        provisionedBusinessCount:
          type: number
          multipleOf: 1
        totalLeadCount:
          type: number
          multipleOf: 1
        zeroLeadBusinessCount:
          type: number
          multipleOf: 1
        uncontactedLeadCount:
          type: number
          multipleOf: 1
        uncontactedOver24HoursCount:
          type: number
          multipleOf: 1
        activePushDeviceCount:
          type: number
          multipleOf: 1
      required:
        - businessCount
        - provisionedBusinessCount
        - totalLeadCount
        - zeroLeadBusinessCount
        - uncontactedLeadCount
        - uncontactedOver24HoursCount
        - activePushDeviceCount
    AdminBusinessSummary:
      type: object
      properties:
        isSample:
          type: boolean
        provisioningState:
          type: string
        unusedNumber7Days:
          type: boolean
        lastCallAt:
          type: [string, "null"]
          format: date-time
        id:
          type: number
          multipleOf: 1
        businessName:
          type: string
        ownerEmail:
          type: [string, "null"]
        ownerName:
          type: [string, "null"]
        ownerLastSignInAt:
          type: [string, "null"]
          format: date-time
        retellPhoneNumber:
          type: [string, "null"]
        provisioningStatus:
          type: string
          enum: [ready, partial, pending]
        createdAt:
          type: string
          format: date-time
        onboardingFieldCount:
          type: number
          multipleOf: 1
        completedOnboardingFieldCount:
          type: number
          multipleOf: 1
        onboardingCompletenessPercent:
          type: number
          multipleOf: 1
        missingOnboardingFields:
          type: array
          items:
            type: string
        totalLeadCount:
          type: number
          multipleOf: 1
        uncontactedLeadCount:
          type: number
          multipleOf: 1
        contactedLeadCount:
          type: number
          multipleOf: 1
        averageResponseTimeMs:
          type: [number, "null"]
        pushEnabledDeviceCount:
          type: number
          multipleOf: 1
        pushPlatforms:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPlatform"
        agreementsAcceptedAt:
          type: [string, "null"]
          format: date-time
        hasNoLeads:
          type: boolean
        hasUncontactedOver24Hours:
          type: boolean
        oldestUncontactedAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - businessName
        - ownerEmail
        - ownerName
        - ownerLastSignInAt
        - retellPhoneNumber
        - provisioningStatus
        - createdAt
        - onboardingFieldCount
        - completedOnboardingFieldCount
        - onboardingCompletenessPercent
        - missingOnboardingFields
        - totalLeadCount
        - uncontactedLeadCount
        - contactedLeadCount
        - averageResponseTimeMs
        - pushEnabledDeviceCount
        - pushPlatforms
        - agreementsAcceptedAt
        - hasNoLeads
        - hasUncontactedOver24Hours
        - oldestUncontactedAt
    AdminOnboardingAnswers:
      type: object
      properties:
        businessName:
          type: string
        agentName:
          type: [string, "null"]
        serviceArea:
          type: [string, "null"]
        businessType:
          type: [string, "null"]
        majorIssueExamples:
          type: [string, "null"]
        personalityToneDescription:
          type: [string, "null"]
        servicesNotOffered:
          type: [string, "null"]
        pricingPolicy:
          type: [string, "null"]
        financingPolicy:
          type: [string, "null"]
        brandsWorkedWith:
          type: [string, "null"]
        typicalResponseTimeCommitment:
          type: [string, "null"]
        warrantyInfo:
          type: [string, "null"]
        maintenancePlanOfferings:
