openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead operations
  - name: businesses
    description: Signed-in owner business profile operations
  - name: notifications
    description: Native lead notification operations
  - name: admin
    description: Read-only founder administration operations
paths:
  /billing/native-summary:
    get:
      operationId: getNativeBillingSummary
      tags: [billing]
      security:
        - clerkSession: []
      summary: Read-only owner billing summary without prices or payment actions
      responses:
        "200":
          description: Persisted billing information; never contacts Stripe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeBillingSummary"
        "401":
          description: Authentication required
        "404":
          description: No business owned by this account
        "503":
          description: Summary temporarily unavailable
  /account/deletion-eligibility:
    get:
      operationId: getAccountDeletionEligibility
      responses:
        "200":
          description: Self-service deletion eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionEligibility"
  /account/me:
    delete:
      operationId: deleteMyAccount
      tags: [businesses]
      summary: Delete the authenticated account and owned app data
      security: [{ ClerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletionInput" }
      responses:
        "200":
          description: App data and identity deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionResult" }
        "202":
          description: App data deleted; identity deletion queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionResult" }
        "400": { description: Invalid confirmation }
        "401": { description: Authentication required }
        "403": { description: Unsafe request origin }
        "409": { description: Subscription or ownership conflict; contact support }
        "503": { description: Cannot safely start deletion }
  /admin/pending-releases:
    get:
      operationId: getPendingRetellReleases
      tags: [admin]
      security: [{ ClerkSession: [] }]
      responses:
        "200":
          description: Minimal resource records for manual review and release
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingRetellRelease" }
        "404": { description: Not authorized }
  /admin/pending-releases/{releaseId}/complete:
    post:
      operationId: completePendingRetellRelease
      tags: [admin]
      security: [{ ClerkSession: [] }]
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: number, multipleOf: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualReleaseInput" }
      responses:
        "204": { description: Recorded manual review/release; no Retell API call }
        "400": { description: Invalid confirmation }
        "404": { description: Not authorized or unknown record }
  /user/welcome:
    post:
      operationId: claimWelcome
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Claim the verified new user's one-time welcome screen
      responses:
        "200":
          description: Welcome eligibility and next destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeEntry"
        "401":
          description: Authentication required
        "403":
          description: Verified email required
        "502":
          description: Welcome could not be checked
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /businesses/me:
    get:
      operationId: getBusinessProfile
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Get the signed-in owner's business profile
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
        "401":
          description: Authentication required
        "404":
          description: No business is configured for this account
        "502":
          description: Business profile could not be loaded
    patch:
      operationId: updateBusinessProfile
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Update the signed-in owner's business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessProfileUpdate"
      responses:
        "200":
          description: Updated business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
        "400":
          description: Invalid or empty business profile update
        "401":
          description: Authentication required
        "404":
          description: No business is configured for this account
        "502":
          description: Business profile could not be updated
  /businesses/me/call-usage:
    get:
      operationId: getBusinessCallUsage
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Get the signed-in business's current-month call usage
      responses:
        "200":
          description: Current month call count and known allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCallUsage"
        "401":
          description: Authentication required
        "404":
          description: No business is configured for this account
  /businesses/me/monthly-report:
    get:
      operationId: getBusinessMonthlyResultsReport
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Get the current-month results report when enabled by an administrator
      responses:
        "200":
          description: Managed monthly report status and results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessMonthlyResultsReport"
        "401":
          description: Authentication required
        "404":
          description: No business is configured for this account
  /businesses/onboarding/website-preview:
    post:
      operationId: previewBusinessWebsite
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Preview public website facts without saving business data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsitePreviewInput"
      responses:
        "200":
          description: Suggestions for owner review, with unsupported fields marked missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsitePreview"
        "400":
          description: Invalid or non-public website URL
        "401":
          description: Authentication required
  /businesses/native-onboard/status:
    get:
      operationId: getNativeBusinessSetupStatus
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Check whether native business setup has already been received
      responses:
        "200":
          description: Minimal persisted setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeBusinessSetupStatus"
        "401":
          description: Authentication required
        "503":
          description: Setup status could not be checked
  /businesses/native-onboard:
    post:
      operationId: submitNativeBusinessSetup
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Submit a plan-free native business setup for admin activation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeBusinessSetupInput"
      responses:
        "201":
          description: New setup received; no plan or phone number assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeBusinessSetupResult"
        "200":
          description: Pending setup retry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeBusinessSetupResult"
        "400":
          description: Invalid setup or missing legal acceptance
        "401":
          description: Authentication required
        "409":
          description: This account already has a business setup
        "502":
          description: Setup could not be saved
  /admin/call-quality:
    get:
      operationId: getAdminCallQuality
      tags: [admin]
      security:
        - clerkSession: []
      summary: Read-only scorecard for the latest 100 recorded inbound calls
      responses:
        "200":
          description: Call quality scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCallQuality"
        "404":
          description: Not found or not authorized
        "502":
          description: Unable to load scorecard
  /businesses/me/demo-call-capability:
    get:
      operationId: getOwnerDemoCallCapability
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Read server-controlled availability of owner test calls
      responses:
        "200":
          description: Current runtime availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDemoCapability"
        "401":
          description: Authentication required
  /businesses/me/demo-call:
    post:
      operationId: createOwnerDemoCall
      tags: [businesses]
      security:
        - clerkSession: []
      summary: Place one test call to the owner's confirmed saved number when enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerDemoConfirmation"
      responses:
        "200":
          description: Test call requested
          content:
            application/json:
              schema:
                type: object
                required: [callId, message]
                properties:
                  callId:
                    type: string
                  message:
                    type: string
        "400":
          description: Missing existing number or unconfirmed owner number
        "401":
          description: Authentication required
        "404":
          description: Not available
        "429":
          description: Three attempts per business day have been used
        "502":
          description: Provider rejected the call or its outcome is uncertain
  /notifications/inbox:
    get:
      operationId: getLeadAlertInbox
      tags: [notifications]
      security:
        - clerkSession: []
      summary: Owner-scoped unread real-lead alerts
      responses:
        "200":
          description: Lead alert inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadAlertInbox"
        "401":
          description: Authentication required
    post:
      operationId: readLeadAlerts
      tags: [notifications]
      security:
        - clerkSession: []
      summary: Mark only the owner's alerts through an observed event ID as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertReadReceipt"
      responses:
        "204":
          description: Alerts marked read
        "401":
          description: Authentication required
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      security:
        - clerkSession: []
      summary: List Google Sheet leads
      description: Returns normalized lead rows for the signed-in business owner.
      responses:
        "200":
          description: Business lead workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadWorkspace"
        "401":
          description: Authentication required
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be read
  /leads/{leadId}:
    get:
      operationId: getLeadDetail
      tags: [leads]
      security:
        - clerkSession: []
      summary: Read one lead belonging to the signed-in business
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Private lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "401":
          description: Authentication required
        "404":
          description: Lead not found
        "502":
          description: Lead could not be loaded
    delete:
      operationId: deleteOwnedLead
      tags: [leads]
      security:
        - clerkSession: []
      summary: Permanently delete one lead belonging to the signed-in business
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Lead and its personal details deleted
        "401":
          description: Authentication required
        "404":
          description: Lead not found
        "502":
          description: Lead data could not be deleted
  /leads/{leadId}/flag:
    post:
      operationId: flagLeadInformation
      tags: [leads]
      security:
        - clerkSession: []
      summary: Flag inaccurate information on an owned lead
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInformationFlagInput"
      responses:
        "200":
          description: Flag submitted or already open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadInformationFlagResult"
        "401":
          description: Authentication required
        "404":
          description: Lead not found
        "502":
          description: Flag could not be saved
  /leads/{leadId}/notes:
    patch:
      operationId: updateLeadNotes
      tags: [leads]
      security:
        - clerkSession: []
      summary: Save private owner notes on an owned lead
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadNotesInput"
      responses:
        "200":
          description: Updated private lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "400":
          description: Invalid notes
        "401":
          description: Authentication required
        "404":
          description: Lead not found
        "502":
          description: Notes could not be saved
  /leads/{leadId}/status:
    patch:
      operationId: updateLeadStatus
      tags: [leads]
      security:
        - clerkSession: []
      summary: Update a lead status
      description: Updates one lead in the signed-in business owner's Google Sheet.
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadStatusUpdate"
      responses:
        "200":
          description: Confirmed lead status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStatusResult"
        "400":
          description: Invalid lead ID or status
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Lead not found in the business sheet
        "409":
          description: The stable lead ID is duplicated
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be updated
  /notifications/status:
    get:
      operationId: getNotificationStatus
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Get notification readiness
      responses:
        "200":
          description: Notification status for the signed-in owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
  /notification-devices:
    post:
      operationId: registerNotificationDevice
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Register or refresh a native push device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDeviceRegistration"
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDevice"
        "400":
          description: Invalid registration
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
  /web-push/config:
    get:
      operationId: getWebPushConfig
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Get browser push configuration
      responses:
        "200":
          description: Browser push capability for the signed-in owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPushConfig"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "503":
          description: Browser push is misconfigured
  /web-push-subscriptions:
    post:
      operationId: registerWebPushSubscription
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Register or refresh this browser's push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushSubscriptionInput"
      responses:
        "200":
          description: Browser subscription registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPushSubscriptionStatus"
        "400":
          description: Invalid browser subscription
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "409":
          description: This browser subscription belongs to another account
        "503":
          description: Browser push is not configured
    delete:
      operationId: revokeWebPushSubscription
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Revoke this browser's push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushSubscriptionRevoke"
      responses:
        "204":
          description: Browser subscription revoked
        "400":
          description: Invalid browser subscription
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
  /notification-devices/{deviceId}:
    delete:
      operationId: revokeNotificationDevice
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Revoke one native push device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      responses:
        "204":
          description: Device revoked
        "400":
          description: Invalid device ID
        "401":
          description: Authentication required
        "404":
          description: Device not found
  /notifications/poll/run:
    post:
      operationId: runNotificationPoll
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Run one poll for the signed-in business
      description: Development verification endpoint. It is unavailable in production.
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPollResult"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Endpoint unavailable in production
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be read
  /notifications/outbox:
    get:
      operationId: listNotificationOutbox
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Inspect queued notifications for the signed-in business
      description: Development verification endpoint. It is unavailable in production.
      responses:
        "200":
          description: Recent notification events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationOutboxEvent"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Endpoint unavailable in production
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      security:
        - clerkSession: []
      summary: Get the read-only founder overview
      description: Requires a verified Clerk email listed in ADMIN_EMAILS. Unauthorized requests receive a not-found response.
      responses:
        "200":
          description: Business overview and global metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "404":
          description: Not found or administrator access is unavailable
  /admin/internal-businesses:
    get:
      operationId: getAdminInternalBusinesses
      tags: [admin]
      responses:
        "200":
          description: Internal businesses and eligible admin owners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBusinessDirectory"
    post:
      operationId: createAdminInternalBusiness
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalBusinessInput"
      responses:
        "200":
          description: >
            Creates a non-billed internal business and locally associates the
            supplied existing Retell number. Does not call Retell, change number
            routing, edit a shared agent, or purchase a phone number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBusinessRecord"
  /admin/retell-webhook-urls:
    get:
      operationId: getAdminRetellWebhookUrls
      tags: [admin]
      security: [{ ClerkSession: [] }]
      summary: Get Retell webhook URLs built from the configured public API base
      responses:
        "200":
          description: Configured production webhook destinations; no Retell settings are changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRetellWebhookUrls"
        "404": { description: Not authorized }
  /admin/internal-businesses/{businessId}:
    patch:
      operationId: updateAdminInternalBusiness
      tags: [admin]
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalBusinessAgentUpdate"
      responses:
        "200":
          description: Updated local agent ID only; no Retell changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBusinessRecord"
  /admin/app-review-demo:
    get:
      operationId: getAdminAppReviewDemo
      tags: [admin]
      security:
        - clerkSession: []
      summary: Read App Review demo status
      description: Requires a verified administrator email. Does not create or modify demo data.
      responses:
        "200":
          description: Current demo business and lead count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppReviewDemoStatus"
        "404":
          description: Not found or administrator access is unavailable
  /admin/app-review-demo/reset:
    post:
      operationId: resetAdminAppReviewDemo
      tags: [admin]
      security:
        - clerkSession: []
      summary: Create or reset the isolated App Review demo
      description: Explicitly replaces only tagged demo leads after safety checks. Never provisions a phone or changes real businesses.
      responses:
        "200":
          description: Demo business with refreshed synthetic leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppReviewDemoStatus"
        "404":
          description: Not found or administrator access is unavailable
        "409":
          description: Unsafe or conflicting business data was found
  /admin/app-review-demo/link:
    post:
      operationId: linkAdminAppReviewDemo
      tags: [admin]
      security:
        - clerkSession: []
      summary: Link an existing Clerk account to the App Review demo
      description: Requires an authorized administrator and an existing Clerk account with an exact email match. Email verification is required unless the administrator explicitly enables the unverified-email override. Never creates an account or changes another business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppReviewDemoLinkInput"
      responses:
        "200":
          description: Demo business linked to the reviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppReviewDemoStatus"
        "400":
          description: Invalid email
        "404":
          description: Reviewer account or demo business was not found
        "409":
          description: Linking would overwrite a different business owner
  /admin/businesses/{businessId}:
    get:
      operationId: getAdminBusiness
      tags: [admin]
      security:
        - clerkSession: []
      summary: Get a business, its leads, and its Retell call history
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusinessDetail"
        "400":
          description: Invalid business ID
        "404":
          description: Not found, business missing, or administrator access unavailable
  /admin/fallback-phone-settings:
    get:
      operationId: getAdminFallbackPhoneSettings
      tags: [admin]
      security:
        - clerkSession: []
      summary: Get the global fallback phone number setting
      responses:
        "200":
          description: Global fallback phone configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFallbackPhoneSettings"
        "502":
          description: Could not load fallback phone settings
    patch:
      operationId: updateAdminFallbackPhoneSettings
      tags: [admin]
      security:
        - clerkSession: []
      summary: Update the global fallback phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFallbackPhoneSettingsUpdate"
      responses:
        "200":
          description: Global fallback phone configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFallbackPhoneSettings"
        "400":
          description: Invalid US phone number
        "502":
          description: Could not update fallback phone settings
  /admin/businesses/{businessId}/fallback-phone:
    patch:
      operationId: updateAdminBusinessFallbackPhone
      tags: [admin]
      security:
        - clerkSession: []
      summary: Set or clear a business fallback phone override
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBusinessFallbackPhoneUpdate"
      responses:
        "200":
          description: Business fallback phone routing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusinessFallbackRouting"
        "400":
          description: Invalid US phone number or business ID
        "404":
          description: Business not found
        "502":
          description: Could not update business fallback phone routing
  /admin/businesses/{businessId}/managed-reports:
    patch:
      operationId: updateAdminManagedReports
      tags: [admin]
      security:
        - clerkSession: []
      summary: Enable or disable managed monthly reports for one business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedReportsInput"
      responses:
        "200":
          description: Managed report setting updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReportsInput"
        "400":
          description: Invalid business ID or input
        "404":
          description: Not found or administrator access is unavailable
  /admin/flagged-leads:
    get:
      operationId: getAdminFlaggedLeads
      tags: [admin]
      security:
        - clerkSession: []
      summary: List unresolved inaccurate-information flags
      responses:
        "200":
          description: Unresolved flags with business and lead IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlaggedLeadsResponse"
        "404":
          description: Not found or administrator access is unavailable
  /admin/lead-information-flags/{flagId}/resolve:
    patch:
      operationId: resolveAdminLeadInformationFlag
      tags: [admin]
      security:
        - clerkSession: []
      summary: Resolve one inaccurate-information flag
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      responses:
        "200":
          description: Flag resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResolveLeadFlagResult"
        "400":
          description: Invalid flag ID
        "404":
          description: Flag not found or administrator access is unavailable
  /admin/activity:
    get:
      operationId: getAdminActivity
      tags: [admin]
      security:
        - clerkSession: []
      summary: Get the global lead activity feed
      responses:
        "200":
          description: Newest leads and global lead counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivity"
        "404":
          description: Not found or administrator access is unavailable
  /admin/email-health:
    get:
      operationId: getAdminEmailHealth
      tags: [admin]
      security: [{clerkSession: []}]
      responses:
        "200":
          description: Lead and admin-test email health
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminEmailHealth"}
        "404": {description: Administrator access unavailable}
  /admin/email-health/test:
    post:
      operationId: sendAdminEmailTest
      tags: [admin]
      security: [{clerkSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailTestRequest"}
      responses:
        "200":
          description: One test attempt, sent only to the authenticated admin
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmailTestResult"}
        "404": {description: Administrator access unavailable}
        "429": {description: Wait one minute between tests}
  /admin/email-health/retry:
    post:
      operationId: retryAdminLeadEmails
      tags: [admin]
      security: [{clerkSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailRetryRequest"}
      responses:
        "200":
          description: Confirmed lead emails queued; no unselected message is retried
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmailRetryResult"}
        "404": {description: Administrator access unavailable}
  /billing/availability:
    get:
      operationId: getBillingAvailability
      responses:
        "200": {description: Billing capability, content: {application/json: {schema: {$ref: "#/components/schemas/BillingAvailability"}}}}
  /billing:
    get:
      operationId: getOwnerBilling
      responses:
        "200": {description: Owner billing, content: {application/json: {schema: {$ref: "#/components/schemas/BillingSnapshot"}}}}
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BillingPlanInput"}}}}
      responses:
        "200": {description: Hosted Checkout, content: {application/json: {schema: {$ref: "#/components/schemas/BillingRedirect"}}}}
  /billing/portal:
    post:
      operationId: createBillingPortal
      responses:
        "200": {description: Hosted Portal, content: {application/json: {schema: {$ref: "#/components/schemas/BillingRedirect"}}}}
  /billing/upgrade:
    post:
      operationId: upgradeBillingPlan
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BillingPlanInput"}}}}
      responses:
        "200": {description: Owner upgrade, content: {application/json: {schema: {$ref: "#/components/schemas/BillingAccount"}}}}
  /billing/cancel:
    post:
      operationId: cancelBilling
      responses:
        "200": {description: Written cancellation, content: {application/json: {schema: {$ref: "#/components/schemas/BillingAccount"}}}}
  /billing/resume:
    post:
      operationId: resumeBilling
      responses:
        "200": {description: Resume before effective date, content: {application/json: {schema: {$ref: "#/components/schemas/BillingAccount"}}}}
  /admin/billing:
    get:
      operationId: getAdminBilling
      responses:
        "200": {description: Admin billing, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/BillingSnapshot"}}}}}
  /admin/billing/readiness-check:
    post:
      operationId: checkAdminBillingReadiness
      security:
        - clerkSession: []
      responses:
        "200": {description: Admin-only configuration and webhook readiness, content: {application/json: {schema: {$ref: "#/components/schemas/BillingReadiness"}}}}
  /admin/sms/messages:
    get:
      operationId: getAdminSmsMessages
      security:
        - clerkSession: []
      responses:
        "200": {description: Recent SMS delivery failures, content: {application/json: {schema: {$ref: "#/components/schemas/AdminSmsMessagesResponse"}}}}
  /admin/sms/test:
    post:
      operationId: sendAdminSmsTest
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SmsTestInput"}
      responses:
        "200": {description: Result of one admin test text, content: {application/json: {schema: {$ref: "#/components/schemas/SmsTestResult"}}}}
  /admin/billing/{businessId}/startup:
    patch:
      operationId: setStartupEligibility
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: integer}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StartupEligibilityInput"}}}}
      responses:
        "200": {description: Admin eligibility, content: {application/json: {schema: {$ref: "#/components/schemas/BillingAccount"}}}}
  /invoicing/me:
    get:
      operationId: getOwnerInvoices
      tags: [Invoicing]
      responses:
        '200':
          description: Owner invoices and payment instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOverview'
  /admin/invoicing:
    get:
      operationId: getAdminInvoices
      tags: [Invoicing]
      responses:
        '200':
          description: Businesses and their invoice history
          content:
            application/json:
              schema:
                type: object
                required: [businesses, settings]
                properties:
                  businesses:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvoiceOverview'
                  settings:
                    $ref: '#/components/schemas/PaymentInstructions'
  /admin/invoicing/settings:
    patch:
      operationId: updateInvoiceSettings
      tags: [Invoicing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInstructions'
      responses:
        '200':
          description: Saved instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstructions'
  /admin/invoicing/{businessId}/approve-startup:
    post:
      operationId: approveStartupInvoice
      tags: [Invoicing]
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: number } }
      responses:
        '200':
          description: Startup approved and invoice queued for email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOverview'
  /admin/invoicing/{businessId}/plan:
    patch:
      operationId: assignAdminBusinessPlan
      tags: [Invoicing]
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBusinessPlanInput'
      responses:
        '200':
          description: Plan assigned and invoice initialized where applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOverview'
        '400': { description: Invalid plan or Startup eligibility }
        '404': { description: Business not found }
        '409': { description: Plan cannot be changed after activation or invoice history }
  /admin/invoicing/{businessId}/activate:
    post:
      operationId: activateAdminBusiness
      tags: [Invoicing]
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: number } }
      responses:
        '200':
          description: Paid business queued for phone provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOverview'
        '404': { description: Business not found }
        '409': { description: Plan assignment and first payment are required }
  /admin/invoicing/invoices/{invoiceId}/paid:
    post:
      operationId: markManualInvoicePaid
      tags: [Invoicing]
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPaymentConfirmation'
      responses:
        '200':
          description: Payment recorded; initial payment queues provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOverview'
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ManualPaymentConfirmation:
      type: object
      required: [reference]
      properties:
        reference: { type: string, maxLength: 500 }
    PaymentInstructions:
      type: object
      required: [instructions, paymentLink]
      properties:
        instructions: { type: string, maxLength: 6000 }
        paymentLink: { type: string, maxLength: 2048 }
    ManualInvoice:
      type: object
      required: [id, number, businessName, plan, payee, monthlyCents, setupCents, totalCents, issuedAt, dueAt, periodKey, status, paidAt, paymentReference, deliveryStatus, reminderStatus]
      properties:
        id: { type: number }
        number: { type: string }
        businessName: { type: string }
        plan: { type: string }
        payee: { type: string }
        monthlyCents: { type: number }
        setupCents: { type: number }
        totalCents: { type: number }
        issuedAt: { type: string }
        dueAt: { type: string }
        periodKey: { type: string }
        status: { type: string, enum: [invoiced, paid, overdue] }
        paidAt: { type: [string, 'null'] }
        paymentReference: { type: [string, 'null'] }
        deliveryStatus: { type: string }
        reminderStatus: { type: string }
    InvoiceOverview:
      type: object
      required: [businessId, businessName, plan, businessAgeMonths, status, serviceActive, provisioningState, invoices, settings]
      properties:
        businessId: { type: number }
        businessName: { type: string }
        plan: { type: [string, 'null'] }
        businessAgeMonths: { type: [number, 'null'] }
        status: { type: string, enum: [legacy, awaiting_activation, requested, invoiced, paid, overdue] }
        serviceActive: { type: boolean }
        provisioningState: { type: string }
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/ManualInvoice'
        settings:
          $ref: '#/components/schemas/PaymentInstructions'
    NativeBusinessSetupStatus:
      type: object
      additionalProperties: false
      properties:
        submitted: { type: boolean }
        businessName: { type: [string, "null"] }
        provisioningState: { type: [string, "null"] }
      required: [submitted, businessName, provisioningState]
    NativeBusinessSetupInput:
      type: object
      additionalProperties: false
      properties:
        businessName: { type: string, minLength: 1, maxLength: 160 }
        ownerEmail: { type: string, pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$", maxLength: 320 }
        businessType: { type: string, minLength: 1, maxLength: 200 }
        servicesOffered: { type: string, minLength: 1, maxLength: 500 }
        servicesNotOffered: { type: string, minLength: 1, maxLength: 500 }
        emergencyAvailable: { type: boolean }
        emergencyEscalationPhone: { type: [string, "null"], maxLength: 16 }
        aiPromisePolicy: { type: string, enum: [callback_only, appointment_windows] }
        serviceArea: { type: string, minLength: 1, maxLength: 4000 }
        majorIssueExamples: { type: string, minLength: 1, maxLength: 4000 }
        businessHours: { type: string, minLength: 1, maxLength: 500 }
        timeZone: { type: string, minLength: 1, maxLength: 100 }
        agentName: { type: string, maxLength: 40 }
        businessWebsiteUrl: { type: string, maxLength: 2048 }
        ownerPhone: { type: [string, "null"], maxLength: 16, pattern: "^\\+[1-9]\\d{7,14}$" }
        smsAlertsConsent: { type: boolean, default: false }
        websiteScrapePreviewed: { type: boolean }
        websiteSuggestionsReviewed: { type: boolean }
        websitePreviewAttempted: { type: boolean }
        privacyAccepted: { type: boolean, enum: [true] }
        termsAccepted: { type: boolean, enum: [true] }
        serviceAgreementAccepted: { type: boolean, enum: [true] }
      required: [businessName, ownerEmail, businessType, servicesOffered, servicesNotOffered, emergencyAvailable, emergencyEscalationPhone, aiPromisePolicy, serviceArea, majorIssueExamples, businessHours, timeZone, privacyAccepted, termsAccepted, serviceAgreementAccepted]
    NativeBusinessSetupResult:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [received] }
        provisioningState: { type: string, enum: [awaiting_activation] }
      required: [status, provisioningState]
    AdminBusinessPlanInput:
      type: object
      additionalProperties: false
      properties:
        plan: { type: string, enum: [startup, starter, professional, managed] }
        startupAgeMonths: { type: number, multipleOf: 1, minimum: 0, maximum: 17 }
      required: [plan]
    AccountDeletionInput:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, enum: [DELETE] }
    AccountDeletionResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [completed, pending] }
        message: { type: string }
    ManualReleaseInput:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, enum: [MANUALLY RELEASED] }
    PendingRetellRelease:
      type: object
      required: [id, businessId, businessName, phoneNumber, agentId, provisioningStatus, createdAt]
      properties:
        id: { type: number, multipleOf: 1 }
        businessId: { type: [number, "null"], multipleOf: 1 }
        businessName: { type: string }
        phoneNumber: { type: [string, "null"] }
        agentId: { type: [string, "null"] }
        provisioningStatus: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    BillingAvailability:
      type: object
      properties:
        enabled: {type: boolean}
        mode: {type: string, enum: [off, test, live]}
      required: [enabled, mode]
    BillingReadiness:
      type: object
      properties:
        enabled: {type: boolean}
        mode: {type: string, enum: [off, test, live]}
        reason: {type: string}
        liveModeOptIn: {type: boolean}
        runningInProduction: {type: boolean}
        secretKeyPresent: {type: boolean}
        secretKeyMode: {type: string, enum: [live, test, unknown, missing]}
        webhookSecretPresent: {type: boolean}
        webhookSecretValid: {type: boolean}
        publicApiBaseValid: {type: boolean}
        webhookUrl: {type: [string, "null"]}
        webhookReachable: {type: [boolean, "null"]}
        sms: {$ref: "#/components/schemas/OwnerSmsReadiness"}
        webPush: {$ref: "#/components/schemas/WebPushReadiness"}
      required: [enabled, mode, reason, liveModeOptIn, runningInProduction, secretKeyPresent, secretKeyMode, webhookSecretPresent, webhookSecretValid, publicApiBaseValid, webhookUrl, webhookReachable, sms, webPush]
    WebPushReadiness:
      type: object
      properties:
        configured: {type: boolean}
        publicKeyPresent: {type: boolean}
        privateKeyPresent: {type: boolean}
        subjectPresent: {type: boolean}
        subjectValid: {type: boolean}
      required: [configured, publicKeyPresent, privateKeyPresent, subjectPresent, subjectValid]
    AdminRetellWebhookUrls:
      type: object
      properties:
        configured: {type: boolean}
        preCallWebhookUrl: {type: [string, "null"]}
        postCallWebhookUrl: {type: [string, "null"]}
      required: [configured, preCallWebhookUrl, postCallWebhookUrl]
    OwnerSmsReadiness:
      type: object
      properties:
        smsEnabled: {type: boolean}
        ready: {type: boolean}
        accountSidPresent: {type: boolean}
        accountSidValid: {type: boolean}
        apiKeySidPresent: {type: boolean}
        apiKeySidValid: {type: boolean}
        apiKeySecretPresent: {type: boolean}
        messagingServiceSidPresent: {type: boolean}
        messagingServiceSidValid: {type: boolean}
        authTokenPresent: {type: boolean}
        inboundWebhookUrlSet: {type: boolean}
        inboundWebhookUrlValid: {type: boolean}
      required: [smsEnabled, ready, accountSidPresent, accountSidValid, apiKeySidPresent, apiKeySidValid, apiKeySecretPresent, messagingServiceSidPresent, messagingServiceSidValid, authTokenPresent, inboundWebhookUrlSet, inboundWebhookUrlValid]
    SmsTestInput:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        to:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
      required: [requestId, to]
    SmsTestResult:
      type: object
      properties:
        id: {type: number, multipleOf: 1}
        status: {type: string, enum: [queued, sent, delivered, failed, undelivered]}
        twilioMessageSid: {type: [string, "null"]}
        errorCode: {type: [string, "null"]}
      required: [id, status, twilioMessageSid, errorCode]
    AdminSmsMessage:
      type: object
      properties:
        id: {type: number, multipleOf: 1}
        businessId: {type: [number, "null"], multipleOf: 1}
        businessName: {type: [string, "null"]}
        leadId: {type: [number, "null"], multipleOf: 1}
        category: {type: string, enum: [lead_alert, test, help_reply]}
        recipientMasked: {type: string}
        status: {type: string, enum: [failed, undelivered]}
        errorCode: {type: [string, "null"]}
        twilioMessageSid: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
      required: [id, businessId, businessName, leadId, category, recipientMasked, status, errorCode, twilioMessageSid, createdAt]
    AdminSmsMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items: {$ref: "#/components/schemas/AdminSmsMessage"}
      required: [messages]
    AccountDeletionEligibility:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: [string, "null"] }
      required: [allowed, reason]
    NativeBillingSummary:
      type: object
      properties:
        planName: { type: [string, "null"] }
        status: { type: string, enum: [active, past_due, canceled, not_subscribed, requested, invoiced, overdue, paid, legacy] }
        nextChargeDate: { type: [string, "null"], format: date-time }
        nextInvoiceDate: { type: [string, "null"], format: date-time }
        billingEnabled: { type: boolean }
        hasStripeCustomer: { type: boolean }
      required: [planName, status, nextChargeDate, billingEnabled, hasStripeCustomer]
    BillingPlanInput:
      type: object
      additionalProperties: false
      properties:
        plan: {type: string, enum: [startup, starter, professional, managed]}
      required: [plan]
    StartupEligibilityInput:
      type: object
      additionalProperties: false
      properties:
        eligible: {type: boolean}
      required: [eligible]
    BillingRedirect:
      type: object
      properties:
        url: {type: string}
      required: [url]
    BillingAccount:
      type: object
      properties:
        plan: {type: [string, "null"], enum: [startup, starter, professional, managed, null]}
        status: {type: string}
        customerId: {type: [string, "null"]}
        subscriptionId: {type: [string, "null"]}
        periodStart: {type: [string, "null"]}
        periodEnd: {type: [string, "null"]}
        paidPeriodEnd: {type: [string, "null"]}
        pastDueSince: {type: [string, "null"]}
        graceEndsAt: {type: [string, "null"]}
        needsAdminReview: {type: boolean}
        cancelAt: {type: [string, "null"]}
        cancelRequestedAt: {type: [string, "null"]}
        cancelRequestedBy: {type: [string, "null"]}
        startupEligible: {type: boolean}
        startupTransitionAt: {type: [string, "null"]}
        setupPaid: {type: boolean}
        usageFlags: {type: array, items: {type: number}}
        lastEvent:
          type: [object, "null"]
          properties:
            id: {type: string}
            type: {type: string}
            created: {type: number}
          required: [id, type, created]
      required: [plan, status, customerId, subscriptionId, periodStart, periodEnd, paidPeriodEnd, pastDueSince, graceEndsAt, needsAdminReview, cancelAt, cancelRequestedAt, cancelRequestedBy, startupEligible, startupTransitionAt, setupPaid, usageFlags, lastEvent]
    BillingSnapshot:
      type: object
      properties:
        businessId: {type: number}
        businessName: {type: string}
        account: {$ref: "#/components/schemas/BillingAccount"}
        usage:
          type: object
          properties:
            count: {type: number}
            limit: {type: [number, "null"]}
            start: {type: string}
            end: {type: string}
          required: [count, limit, start, end]
        plans:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              label: {type: string}
              monthlyCents: {type: number}
              setupCents: {type: number}
              callLimit: {type: [number, "null"]}
            required: [id, label, monthlyCents, setupCents, callLimit]
        policy:
          type: object
          properties:
            cancellationNoticeDays: {type: number}
            failedPaymentGraceBusinessDays: {type: number}
            startupEligibilityBusinessAgeMonths: {type: number}
            startupTransitionMonths: {type: number}
          required: [cancellationNoticeDays, failedPaymentGraceBusinessDays, startupEligibilityBusinessAgeMonths, startupTransitionMonths]
        timeline:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              type: {type: string}
              actor: {type: [string, "null"]}
              detail: {type: string}
              createdAt: {type: string}
            required: [id, type, actor, detail, createdAt]
      required: [businessId, businessName, account, usage, plans, policy, timeline]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
