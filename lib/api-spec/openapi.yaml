openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead operations
  - name: notifications
    description: Native lead notification operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      security:
        - clerkSession: []
      summary: List Google Sheet leads
      description: Returns normalized lead rows for the signed-in business owner.
      responses:
        "200":
          description: Business lead workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadWorkspace"
        "401":
          description: Authentication required
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be read
  /leads/{leadId}/status:
    patch:
      operationId: updateLeadStatus
      tags: [leads]
      security:
        - clerkSession: []
      summary: Update a lead status
      description: Updates one lead in the signed-in business owner's Google Sheet.
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadStatusUpdate"
      responses:
        "200":
          description: Confirmed lead status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStatusResult"
        "400":
          description: Invalid lead ID or status
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Lead not found in the business sheet
        "409":
          description: The stable lead ID is duplicated
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be updated
  /notifications/status:
    get:
      operationId: getNotificationStatus
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Get notification readiness
      responses:
        "200":
          description: Notification status for the signed-in owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationStatus"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
  /notification-devices:
    post:
      operationId: registerNotificationDevice
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Register or refresh a native push device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDeviceRegistration"
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDevice"
        "400":
          description: Invalid registration
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
  /notification-devices/{deviceId}:
    delete:
      operationId: revokeNotificationDevice
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Revoke one native push device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
      responses:
        "204":
          description: Device revoked
        "400":
          description: Invalid device ID
        "401":
          description: Authentication required
        "404":
          description: Device not found
  /notifications/poll/run:
    post:
      operationId: runNotificationPoll
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Run one poll for the signed-in business
      description: Development verification endpoint. It is unavailable in production.
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPollResult"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Endpoint unavailable in production
        "429":
          description: Google Sheets rate limit reached
        "502":
          description: Google Sheets could not be read
  /notifications/outbox:
    get:
      operationId: listNotificationOutbox
      tags: [notifications]
      security:
        - clerkSession: []
        - clerkBearer: []
      summary: Inspect queued notifications for the signed-in business
      description: Development verification endpoint. It is unavailable in production.
      responses:
        "200":
          description: Recent notification events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationOutboxEvent"
        "401":
          description: Authentication required
        "403":
          description: No business is configured for this account
        "404":
          description: Endpoint unavailable in production
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Lead:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        issue:
          type: string
        address:
          type: string
        urgency:
          type: string
          enum: [urgent, normal, low]
        status:
          type: string
          enum: [pending, contacted]
        createdAt:
          type: string
          format: date-time
        contactedAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - name
        - phone
        - issue
        - address
        - urgency
        - status
        - createdAt
        - contactedAt
    LeadStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, contacted]
      required:
        - status
    LeadStatusResult:
      type: object
      properties:
        leadId:
          type: string
        status:
          type: string
          enum: [pending, contacted]
        contactedAt:
          type: [string, "null"]
          format: date-time
      required:
        - leadId
        - status
        - contactedAt
    LeadWorkspace:
      type: object
      properties:
        configured:
          type: boolean
        businessName:
          type: [string, "null"]
        timeZone:
          type: [string, "null"]
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required:
        - configured
        - businessName
        - timeZone
        - leads
    NotificationPlatform:
      type: string
      enum: [ios, android]
    NotificationDeviceRegistration:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
        platform:
          $ref: "#/components/schemas/NotificationPlatform"
        enabled:
          type: boolean
          default: true
      required:
        - token
        - platform
    NotificationDevice:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        platform:
          $ref: "#/components/schemas/NotificationPlatform"
        enabled:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - platform
        - enabled
        - lastSeenAt
    NotificationStatus:
      type: object
      properties:
        enabledDeviceCount:
          type: number
          multipleOf: 1
        devices:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDevice"
        poller:
          type: object
          properties:
            initialized:
              type: boolean
            lastSucceededAt:
              type: [string, "null"]
              format: date-time
            lastError:
              type: [string, "null"]
          required:
            - initialized
            - lastSucceededAt
            - lastError
      required:
        - enabledDeviceCount
        - devices
        - poller
    NotificationPollResult:
      type: object
      properties:
        businessId:
          type: string
        baselineCreated:
          type: boolean
        rowsRead:
          type: number
          multipleOf: 1
        newEvents:
          type: number
          multipleOf: 1
        duplicateRows:
          type: number
          multipleOf: 1
        polledAt:
          type: string
          format: date-time
      required:
        - businessId
        - baselineCreated
        - rowsRead
        - newEvents
        - duplicateRows
        - polledAt
    NotificationOutboxEvent:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        leadId:
          type: string
        status:
          type: string
          enum: [queued, delivered, failed]
        attempts:
          type: number
          multipleOf: 1
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        lastError:
          type: [string, "null"]
      required:
        - id
        - leadId
        - status
        - attempts
        - createdAt
        - deliveredAt
        - lastError

