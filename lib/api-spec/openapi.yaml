openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      security:
        - clerkSession: []
      summary: List Google Sheet leads
      description: Returns normalized lead rows for the signed-in business owner.
      responses:
        "200":
          description: Business lead workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadWorkspace"
        "401":
          description: Authentication required
        "502":
          description: Google Sheets could not be read
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Lead:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        issue:
          type: string
        address:
          type: string
        urgency:
          type: string
          enum: [urgent, normal, low]
        status:
          type: string
          enum: [pending, contacted]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - issue
        - address
        - urgency
        - status
        - createdAt
    LeadWorkspace:
      type: object
      properties:
        configured:
          type: boolean
        businessName:
          type: [string, "null"]
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required:
        - configured
        - businessName
        - leads

